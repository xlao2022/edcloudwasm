
name = "edcloudwasm"
main = "_worker.js"
compatibility_date = "2026-10-19"
keep_vars = true
minify = true

# 变量和密码在 Cloudflare 后台设置，不在这里填写

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# 每次部署前自动加盐混淆 WASM
[build]
command = "node -e \"const fs=require('fs'),c=require('crypto'),n=16+(Math.random()*110|0);fs.appendFileSync('protocol.wasm',Buffer.concat([Buffer.from([0,n+2,1,115]),c.randomBytes(n)]))\""
